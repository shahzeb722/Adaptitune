[build-system]
requires = ["setuptools>=68,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptitune"
version = "0.1.0"
description = "On-device vocal pitch correction that learns each singer's preferences"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [
  { name = "Muhammad Shahzeb Khan" },
  { name = "Haris Khan" },
  { name = "Afzaal Afzal" },
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
  "librosa>=0.10",
  "pyworld>=0.3.4",
  "praat-parselmouth>=0.4.3",
  "mir_eval>=0.7",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "tabulate>=0.9",  # pandas to_markdown for result tables
  "pyyaml>=6",  # MedleyDB metadata
  "setuptools<81",  # pyworld still imports pkg_resources
]

[project.optional-dependencies]
app = ["PySide6>=6.6", "sounddevice>=0.4", "onnxruntime>=1.17"]
neural = ["torch>=2.2", "pesto-pitch>=1.0", "torchfcpe>=0.0.4", "onnx>=1.15", "onnxruntime>=1.17"]
study = ["statsmodels>=0.14"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4"]

[project.scripts]
adaptitune = "adaptitune.cli:main"
adaptitune-app = "adaptitune.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::UserWarning:pyworld", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.package-data]
adaptitune = ["agent/population_model.json"]
